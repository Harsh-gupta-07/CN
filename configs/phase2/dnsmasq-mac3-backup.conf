listen-address=127.0.0.1,10.7.19.127
bind-interfaces
no-resolv
server=8.8.8.8
domain-needed

# name,IP,TTL  - the trailing 30 is the TTL (without it dnsmasq answers with TTL 0)
host-record=app.jio.test,10.7.2.8,30
host-record=api.jio.test,10.7.2.8,30
host-record=ttl.jio.test,10.7.2.8,30

log-queries
log-facility=/tmp/dnsmasq.log
