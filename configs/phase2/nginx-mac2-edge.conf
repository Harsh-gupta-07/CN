worker_processes 1;
events { worker_connections 1024; }

http {
  # Phase 2: log WHICH backend served each request (and any retry: "ustatus=502, 200")
  log_format upstreamlog '$time_local client=$remote_addr "$request" status=$status '
                         'upstream=$upstream_addr ustatus=$upstream_status '
                         'urt=$upstream_response_time';
  access_log /opt/homebrew/var/log/nginx/access.log upstreamlog;
  error_log  /opt/homebrew/var/log/nginx/error.log warn;   # warn: shows "upstream server temporarily disabled"

  upstream app_backend {                 # round-robin by default
    server 10.7.19.127:3001 max_fails=1 fail_timeout=10s;   # Backend A (Mac 3)
    server 10.7.24.144:3002 max_fails=1 fail_timeout=10s;   # Backend B (Mac 4)
  }

  # HTTP: redirect everything to HTTPS
  server {
    listen 80;
    server_name app.jio.test api.jio.test;
    return 301 https://$host$request_uri;
  }

  # HTTPS: TLS terminates here
  server {
    listen 443 ssl;
    http2 on;                            # needs nginx >= 1.25.1
    server_name app.jio.test api.jio.test;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/app.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Edge "mac2" always;     # Phase 2: which edge answered (Extension E)

    location / {
      proxy_pass http://app_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_read_timeout    5s;                                   # Phase 2: hung backend = failed
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;                                # Phase 2: retry once on the other backend
    }
  }
}
